<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D-ToolBox</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; background: #111; color: #ccc; font-family: monospace; }
      /* Hide the native number-input spinner app-wide. Where the panel renders
         its own ▲/▼ stepper, the two would sit side by side and read as
         duplicates; everywhere else the spinner is only visual noise on the
         dark tool styling. Fine-tuning is NOT lost: <input type="number">
         still steps with the ↑/↓ arrow keys regardless of the spinner's
         visibility, and every field here is small enough to retype. */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
